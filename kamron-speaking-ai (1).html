<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamron Speaking AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      height: 92vh;
      max-height: 700px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #e8eaed;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .avatar i { font-size: 20px; color: #2563eb; }
    .header-text .name { font-size: 15px; font-weight: 600; color: #111827; }
    .header-text .status { font-size: 12px; color: #16a34a; margin-top: 1px; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }
    .msg { max-width: 80%; display: flex; flex-direction: column; gap: 4px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.bot .bubble {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-time { font-size: 11px; color: #9ca3af; padding: 0 4px; }
    .topics {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 16px 10px;
      background: #fff;
      border-top: 1px solid #f1f3f5;
    }
    .topic-chip {
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s;
    }
    .topic-chip:hover { background: #e5e7eb; }
    .chat-input {
      border-top: 1px solid #e8eaed;
      padding: 12px 14px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: #fff;
    }
    .chat-input textarea {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      min-height: 38px;
      max-height: 100px;
      background: #f9fafb;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input textarea:focus { border-color: #2563eb; background: #fff; }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .send-btn:hover { background: #1d4ed8; }
    .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
    .typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
    @media (max-width: 480px) {
      body { padding: 0; align-items: flex-end; }
      .chat-wrap { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
<div class="chat-wrap">
  <div class="chat-header">
    <div class="avatar"><i class="ti ti-message-circle"></i></div>
    <div class="header-text">
      <div class="name">Kamron Speaking AI</div>
      <div class="status">● Online</div>
    </div>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="topics">
    <span class="topic-chip" onclick="quickSend('Help me with grammar')">Grammar</span>
    <span class="topic-chip" onclick="quickSend('Let\'s practice speaking')">Speaking practice</span>
    <span class="topic-chip" onclick="quickSend('Teach me new vocabulary')">Vocabulary</span>
    <span class="topic-chip" onclick="quickSend('Correct my English')">Correction</span>
  </div>

  <div class="chat-input">
    <textarea id="userInput" placeholder="Write anything in English..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <i class="ti ti-send"></i>
    </button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const history = [];

const systemPrompt = `You are Kamron Speaking AI, a warm and encouraging English language tutor. Your role is to help learners improve their English through conversation, grammar explanations, vocabulary building, and speaking practice.

Guidelines:
- Keep responses concise and clear (3-5 sentences unless explaining a rule)
- Always be encouraging and positive
- When a student makes a grammar or spelling mistake, gently correct it at the end of your reply with "💡 Small correction:"
- Use simple language appropriate for intermediate learners
- If asked about grammar rules, give a clear explanation with 1-2 examples
- Engage naturally in conversation to build confidence
- Suggest follow-up practice when relevant
- Always refer to yourself as "Kamron Speaking AI"`;

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${text.replace(/\n/g, '<br>')}</div><span class="msg-time">${getTime()}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function callClaude(userText) {
  history.push({ role: 'user', content: userText });
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemPrompt,
      messages: history
    })
  });
  const data = await response.json();
  const reply = data.content.map(b => b.text || '').join('');
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  autoResize(inputEl);
  sendBtn.disabled = true;
  addMessage(text, 'user');
  showTyping();
  try {
    const reply = await callClaude(text);
    removeTyping();
    addMessage(reply, 'bot');
  } catch (e) {
    removeTyping();
    addMessage('Sorry, something went wrong. Please try again!', 'bot');
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function quickSend(text) {
  inputEl.value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

addMessage("Hi! I'm Kamron Speaking AI 👋 I'm here to help you practice English speaking, fix grammar, learn new words, and build your confidence. What would you like to work on today?", 'bot');
</script>
</body>
</html>
